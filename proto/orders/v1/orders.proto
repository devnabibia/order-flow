syntax = "proto3";

package orders.v1;

option go_package = "github.com/example/orderflow/gen/orders/v1;ordersv1";

// Synchronous client API. Everything that changes other services' state
// happens through events, not through this API.
service OrdersService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (Order);
}

message Item {
  string sku = 1;
  int32 quantity = 2;
  int64 unit_price_cents = 3;
}

message CreateOrderRequest {
  string customer_id = 1;
  repeated Item items = 2;
  // Retries with the same key return the original order instead of creating a new one.
  string idempotency_key = 3;
}

message CreateOrderResponse {
  string id = 1;
  string status = 2;
  bool created = 3; // false when the idempotency key matched an existing order
}

message GetOrderRequest {
  string id = 1;
}

message Order {
  string id = 1;
  string customer_id = 2;
  string status = 3; // PENDING | CONFIRMED | CANCELLED
  int64 total_cents = 4;
  repeated Item items = 5;
  string created_at = 6; // RFC 3339
}
