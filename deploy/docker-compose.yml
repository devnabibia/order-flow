x-service: &service
  restart: on-failure
  environment: &env
    NATS_URL: nats://nats:4222
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
  depends_on: [nats, jaeger]

services:
  nats:
    image: nats:2.10
    command: ["-js"]
    ports: ["4222:4222"]

  jaeger:
    image: jaegertracing/all-in-one:1.58
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]   # Jaeger UI

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9091:9090"]

  orders-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: orders }
  inventory-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: inventory }
  payments-db:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: payments }

  orders:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: orders } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:postgres@orders-db:5432/orders
    depends_on: [nats, jaeger, orders-db]
    ports: ["8080:8080", "9000:9000"]   # HTTP + dashboard, gRPC

  inventory:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: inventory } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:postgres@inventory-db:5432/inventory
    depends_on: [nats, jaeger, inventory-db]
    ports: ["8081:8081"]                # GET /stock

  payments:
    <<: *service
    build: { context: .., dockerfile: deploy/Dockerfile, args: { SERVICE: payments } }
    environment:
      <<: *env
      DATABASE_URL: postgres://postgres:postgres@payments-db:5432/payments
    depends_on: [nats, jaeger, payments-db]
